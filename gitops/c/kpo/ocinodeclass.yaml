      subnetConfig:
        subnetId: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaaeeya576wbkqyprx6jagcwqgksrrzaljonelynl7e5vs6mldmimna
      assignPublicIp: true
    secondaryVnicConfigs:
      - subnetConfig:
          subnetId: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaaa35cgdcaya5stj2qbu4lc5ml7ivnm35ew2acv6z5vv5k7a4dqzha
        ipCount: 32
        skipSourceDestCheck: true
