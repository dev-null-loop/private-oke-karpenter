apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-chart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  sources:
    - repoURL: https://oracle.github.io/karpenter-provider-oci/charts
      chart: karpenter
      targetRevision: 1.3.0
      helm:
        valueFiles:
          - $values/gitops/clusters/private-oke-karpenter/karpenter/values.yaml
    - repoURL: https://github.com/dev-null-loop/private-oke-karpenter.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
