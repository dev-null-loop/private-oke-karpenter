"apiVersion": "argoproj.io/v1alpha1"
"kind": "Application"
"metadata":
  "annotations":
    "argocd.argoproj.io/sync-wave": "1"
  "name": "karpenter-manifests"
  "namespace": "argocd"
"spec":
  "destination":
    "namespace": "karpenter"
    "server": "https://kubernetes.default.svc"
  "project": "default"
  "source":
    "path": "gitops/clusters/private-oke-karpenter/karpenter"
    "repoURL": "https://github.com/dev-null-loop/private-oke-karpenter.git"
    "targetRevision": "main"
  "syncPolicy":
    "automated":
      "prune": true
      "selfHeal": true
