"apiVersion": "apps/v1"
"kind": "Deployment"
"metadata":
  "name": "karpenter-test-workload"
"spec":
  "replicas": 50
  "selector":
    "matchLabels":
      "app": "karpenter-test-workload"
  "template":
    "metadata":
      "labels":
        "app": "karpenter-test-workload"
    "spec":
      "containers":
      - "command":
        - "sh"
        - "-c"
        - "sleep 3600"
        "image": "busybox:1.36"
        "name": "main"
        "resources":
          "requests":
            "cpu": "2"
            "memory": "4Gi"
      "nodeSelector":
        "karpenter.sh/nodepool": "karpenter-general"
      "tolerations":
      - "operator": "Exists"
